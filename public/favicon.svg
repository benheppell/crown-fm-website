<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Crown FM brand favicon: warm near-black tile, gold crown silhouette. -->
  <rect width="64" height="64" rx="8" fill="#0d0d0c"/>
  <!-- Crown: left spike, peak, centre diamond, peak, right spike.
       Path roughly traces the crown from the brand logo, simplified
       so it reads cleanly at 16x16. -->
  <path
    d="M10 24 L14 18 L20 24 L26 16 L32 12 L38 16 L44 24 L50 18 L54 24 L51 40 L13 40 Z"
    fill="#d4af6e"/>
  <!-- Two small jewel dots inside the crown -->
  <circle cx="22" cy="29" r="2" fill="#0d0d0c"/>
  <circle cx="42" cy="29" r="2" fill="#0d0d0c"/>
</svg>
